@media(prefers-color-scheme:dark){.share-illustration{opacity:.24}.tone-blue{--art-color:#91adcc}.tone-teal{--art-color:#8fbcb3}.tone-violet{--art-color:#afa0cc}.tone-amber{--art-color:#c8b087}.tone-rose{--art-color:#c8a0b0}}

/* 中等比例主题线稿：留足边距，底部渐隐以避开正文。 */
.share-illustration{inset:10px 12px auto auto;width:clamp(108px,44%,132px);height:78px;padding:0;opacity:.36;mask-image:linear-gradient(to right,transparent 0%,#000 26%),linear-gradient(to bottom,#000 0%,#000 68%,transparent 100%);mask-composite:intersect;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 26%),linear-gradient(to bottom,#000 0%,#000 68%,transparent 100%);-webkit-mask-composite:source-in}
.share-illustration svg{transform:none;stroke-width:1.05}.share-illustration .art-detail{stroke-width:.75;opacity:.64}
@media(prefers-color-scheme:dark){.share-illustration{opacity:.32}}
@media(max-width:460px){.share-illustration{width:128px;height:78px;right:14px}}

</head>
<body>
<div class="global-navbar"><nav class="global-nav-inner" aria-label="全局导航"><a class="brand" href="./" aria-label="本地导航，返回首页"><span class="brand-mark" aria-hidden="true">⌘</span> 本地导航</a><div class="search global-search" role="search"><span class="icon" aria-hidden="true"></span><input id="unified-input" type="search" aria-label="全局搜索服务与分享链接" placeholder="全局搜索服务、分享链接、英文别名…" autocomplete="off" disabled><kbd>⌘ K</kbd></div></nav></div>
<div class="shell">
<aside class="sidebar"><p class="sidebar-caption">服务目录</p><nav id="chips" class="chips" aria-label="服务分类"></nav><div class="sidebar-bottom"><strong id="instance-address"></strong><span id="instance-note"></span></div></aside>
<div class="workspace"><header><div><h1>本地服务</h1><p class="subtitle">不用记住端口，找到服务就出发。</p></div><div class="header-actions"><details class="settings"><summary>配置</summary><div class="toolbar"><button id="btn-export">导出配置</button><button id="btn-import">导入配置</button><input id="file-import" type="file" accept="application/json,.json" aria-label="导入配置文件" hidden><button id="btn-reset">重置默认</button></div></details><button class="primary" id="add">＋ 添加服务</button></div></header>
<div class="search"><span class="icon" aria-hidden="true"></span><input id="q" aria-label="搜索服务" placeholder="筛选当前服务：名称、别名或端口…" autocomplete="off" autocapitalize="off"></div><div id="hint" role="status"></div>
<main><div class="list-heading"><h2><b id="view-title">全部服务</b><span id="result-count"></span></h2><button class="quiet" id="refresh">↻ 重新检测</button></div><div class="list"><div class="columns" aria-hidden="true"><span>服务</span><span>端口</span><span>连接</span><span>管理</span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden></div></div></main>
<footer><p>“可达”表示收到 HTTP 响应，不代表应用功能正常。浏览器受限或连接失败显示“未确认”；非网页服务不检测。</p><details><summary>地址栏快开</summary><p>浏览器搜索引擎关键字设为 <code>go</code><br>网址：<code><span id="quick-url"></span></code><br>试试 <code>go <span id="quick-example"></span></code></p></details></footer></div></div>
<dialog id="editor" aria-labelledby="form-title"><form method="dialog" id="form">
  <h2 id="form-title">添加服务</h2>
  <input type="hidden" id="f-id">
  <label for="f-name">中文名 *</label>
  <input id="f-name" required placeholder="例如：记账本">
  <label for="f-aliases">别名（逗号分隔，小写，便于搜索）</label>
  <input id="f-aliases" placeholder="例如：jizhang,账本,finance">
  <label for="f-url">访问 URL *</label>
  <input id="f-url" required placeholder="https://example.com">
  <div class="formrow">
    <div><label for="f-category">分类</label><select id="f-category"></select></div>
    <div><label for="f-emoji">图标 emoji</label><input id="f-emoji" placeholder="📌"></div>
  </div>
  <label for="f-note">备注</label>
  <textarea id="f-note" rows="2" placeholder="这是什么服务、有什么用"></textarea>
  <div class="formrow" style="margin-top:10px">
    <div><label><input type="checkbox" id="f-tunnel"> SSH 隧道到 VPS</label></div>
    <div><label><input type="checkbox" id="f-nonweb"> 非网页服务</label></div>
  </div>
  <div class="formbtns">
    <button type="button" class="btn-cancel" id="btn-cancel">取消</button>
    <button type="submit" class="btn-save">保存</button>
  </div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>


<script src="config.js"></script>
<script src="bootstrap.js?v=0.2.0-card-media"></script>
</body>
</html>
